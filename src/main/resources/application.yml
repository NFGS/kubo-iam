server:
  port: ${PORT:8081}
  servlet:
    context-path: /api/v1
  # Malla interna (P-28, ADR-0020): HTTPS exigiendo el certificado del cliente.
  # Se enciende con KUBO_INTERNAL_TLS=true; sin la bandera el servicio sirve HTTP.
  ssl:
    enabled: ${KUBO_INTERNAL_TLS:false}
    certificate: file:${KUBO_TLS_CERT:/certs/iam.crt}
    certificate-private-key: file:${KUBO_TLS_KEY:/certs/iam.key}
    trust-certificate: file:${KUBO_TLS_CA:/certs/ca.crt}
    client-auth: need

spring:
  application:
    name: kubo-iam
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kubo_iam}
    username: ${SPRING_DATASOURCE_USERNAME:kubo_iam}
    password: ${SPRING_DATASOURCE_PASSWORD:kubo_iam_dev}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

kubo:
  jwt:
    issuer: kubo-iam
    audience: kubo-api
    access-token-minutes: ${KUBO_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${KUBO_REFRESH_TOKEN_DAYS:7}
    private-key-pem: ${KUBO_JWT_PRIVATE_KEY:}
  seed:
    enabled: ${KUBO_SEED_ENABLED:false}
    admin-email: ${KUBO_ADMIN_EMAIL:admin@kubo.local}
    admin-password: ${KUBO_ADMIN_PASSWORD:Admin123!}
    tenant-name: ${KUBO_TENANT_NAME:Tienda La Esquina}
  payments:
    # Secreto compartido con el proveedor para firmar sus webhooks (HMAC-SHA256).
    # Vacio = webhook deshabilitado (el cobro manual del panel sigue disponible).
    webhook-secret: ${KUBO_PAYMENTS_WEBHOOK_SECRET:}
  totp:
    # Sin llave el servicio no arranca: el secreto TOTP no puede quedar en claro.
    encryption-key: ${KUBO_TOTP_ENCRYPTION_KEY:}
  auth:
    max-failed-attempts: ${KUBO_AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${KUBO_AUTH_LOCK_MINUTES:15}
    reset-token-minutes: ${KUBO_AUTH_RESET_TOKEN_MINUTES:30}
  mail:
    transport: ${KUBO_MAIL_TRANSPORT:log}
    from: ${KUBO_MAIL_FROM:no-responder@kubo.local}
    reset-url-base: ${KUBO_RESET_URL_BASE:http://localhost:3000/recuperar}
    smtp-host: ${KUBO_SMTP_HOST:}
    smtp-port: ${KUBO_SMTP_PORT:587}
    smtp-username: ${KUBO_SMTP_USERNAME:}
    smtp-password: ${KUBO_SMTP_PASSWORD:}
    smtp-starttls: ${KUBO_SMTP_STARTTLS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  # Trazas OTLP hacia el collector (P-07). Sin collector la aplicacion arranca
  # igual: el exportador falla en silencio y no afecta al servicio.
  tracing:
    sampling:
      probability: ${KUBO_TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    # Solo trazas: el pipeline del collector no procesa metricas.
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  level:
    root: INFO
    co.kubo: INFO
